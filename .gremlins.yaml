unleash:
  # The initial coverage run is much shorter than a real test run, so the
  # default timeout kills mutants that are merely slow.
  timeout-coefficient: 40
  # Most surviving mutants drop the check of an I/O error or sync that never
  # fails in tests (only fault injection could kill them), change nothing
  # observable (writing an empty buffer, the batch size limit), or sit in
  # unreachable guards.
  threshold:
    efficacy: 78
    mutant-coverage: 90

mutants:
  invert-assignments:
    enabled: true
  invert-logical:
    enabled: true
  invert-loopctrl:
    enabled: true
  remove-self-assignments:
    enabled: true
